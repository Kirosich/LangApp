services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - server/.env
    volumes:
      - ./data:/app/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - default
      - edge

volumes:
  caddy_data:
  caddy_config:

networks:
  default: {}
  edge:
    external: true
